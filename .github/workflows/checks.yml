name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Account deletion service tests
        run: deno test --allow-env supabase/functions/delete-account/handler.test.ts
