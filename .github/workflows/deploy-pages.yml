name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Expo CLI only reads EXPO_PUBLIC_* vars from a .env file (not from the
      # process environment), so the secrets have to be written there first.
      - name: Write .env
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env

      - name: Export web build
        run: npx expo export -p web

      # GitHub Pages is a static host with no server-side rewrites: an
      # in-app navigation changes the URL (e.g. /roomly/list), and reloading
      # or deep-linking to that URL 404s because no such file exists. Serving
      # the same index.html for any unmatched path lets Expo Router's client
      # -side navigation take over and render the right screen.
      - name: Add SPA fallback for GitHub Pages routing
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # GitHub Pages caches index.html for 10 minutes and gives no way to
          # change that. Wiping the old hashed bundle on deploy means anyone
          # holding a cached index.html requests a file that no longer exists,
          # gets a 404, and sees a blank page until their cache expires — so
          # previous builds are kept alongside the new one instead.
          keep_files: true
